<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLB - Piano</title>
  <link rel="stylesheet" href="navigation bar style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff; /* White background */
      color: #333;
      margin: 0; /* Remove default margin */
      padding: 0; /* Remove default padding */
    }

    .navigation {
      display: flex; /* Flexbox for navigation */
      justify-content: space-between; /* Space between left and right sections */
      align-items: center; /* Center the content vertically */
      padding: 20px 20px; /* Padding for spacing */
      width: 100%; /* Full width of the screen */
      background-color: transparent; /* Transparent background */
      position: fixed; /* Fixes the navigation at the top */
      top: 0; /* Aligns to the top of the page */
      left: 0; /* Aligns to the left of the page */
      z-index: 1000; /* Ensures it stays above other content */
      box-sizing: border-box;
    }

    .navigation .mlb-link {
      font-size: 24px; /* Font size for MLB */
      margin: 0; /* Remove default margin */
    }

    .navigation .nav-links {
      display: flex; /* Flexbox for links */
      gap: 15px; /* Space between links */
    }

    .navigation a {
      text-decoration: none; /* Removes underline from links */
      color: #333; /* Link text color */
      font-weight: bold; /* Bold for links */
      font-size: 18px; /* Font size for links */
    }
    
    .navigation a:hover {
      text-decoration: underline; /* Underline on hover */
      color: rgb(131, 0, 22);
      text-decoration: none; /* Underline on hover */
    }

    .navigation a:active {
      color: rgb(131, 0, 22); /* Ensure color remains red when link is clicked */
    }

    .game-container {
      position: fixed;
      top: 80px; /* below nav */
      left: 0;
      width: 100%;
      height: calc(100vh - 80px);
    }
 
    .game-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 600px) {
   .navigation {
    flex-direction: column;
    background: rgba(255, 255, 255, 0.6); /* light blur on mobile only */
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
    .navigation .nav-links {
    flex-direction: column;
    gap: 10px; /* Adjust gap for smaller screens */
  }
    .navigation a {
  font-size: 16px; /* Smaller font size for smaller screens */
  }
   .mlb-link {
  display: flex;
  justify-content: center;
  width: 100%;
  }
  .game-container {
        top: 120px;
        height: calc(100vh - 120px);
  }
   }
  </style>
</head>
<body>
  <div class="navigation">
    <h1 class="mlb-link">
      <a href="index.html">
        <img src="Image/Web/Mia.png" alt="MLB Logo" style="height: 40px;">
      </a></h1>
    <div class="nav-links">
      <a href="Work.html">Works</a>
      <a href="About.html">About</a>
    </div>
  </div>

  <div class="game-container">
    <iframe
      src="piano/index.html"
      allowfullscreen
      allow="autoplay; cross-origin-isolated">
    </iframe>
  </div>

  <script>
    if (!window.crossOriginIsolated && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('coi-serviceworker.js').then(function(reg) {
        if (reg.installing || reg.waiting) {
          window.location.reload();
        } else if (reg.active) {
          if (!sessionStorage.getItem('coiReloaded')) {
            sessionStorage.setItem('coiReloaded', '1');
            window.location.reload();
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      console.log('Page loaded');
    });
  </script>
</body>
</html>
